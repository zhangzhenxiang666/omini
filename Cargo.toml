[workspace]
members = [
    "crates/omini-cli",
    "crates/omini-config",
    "crates/omini-core",
    "crates/omini-domain",
    "crates/omini-mcp-client",
    "crates/omini-model",
    "crates/omini-permissions",
    "crates/omini-provider-api",
    "crates/omini-protocol",
    "crates/omini-runtime-contract",
    "crates/omini-server",
    "crates/omini-entity",
    "crates/omini-tui",
]
default-members = ["crates/omini-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.7", features = ["ws", "macros", "multipart"] }
base64 = "0.22.1"
bon = "3.10.1"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
daemonize = "0.5.0"
dirs = "6.0.0"
futures-util = "0.3.31"
http = "1.4.0"
indexmap = { version = "2.14.0", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
pin-project-lite = "0.2.17"
pulldown-cmark = "0.13"
rand = "0.8"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", features = ["json", "stream", "multipart"] }
rmcp = { version = "1.7.0", default-features = false, features = [
    "client",
    "schemars",
    "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
similar = { version = "3.1", features = ["text"] }
thiserror = "2.0.18"
toasty = { version = "0.11.0", default-features = false, features = ["sqlite", "jiff", "serde"] }
toasty-driver-sqlite = "0.11.0"
tokio = { version = "1.52.2", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "process",
    "time",
] }
tokio-stream = { version = "0.1.18", features = ["time"] }
tokio-tungstenite = "0.29.0"
toml = "1.1.2"
toml_edit = "0.23.7"
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
unicode-width = "0.2"
uuid = { version = "1.23.1", features = ["v4"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "jiff_0_2", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = ["axum", "vendored"] }
url = { version = "2.5.8", features = ["serde"] }

omini-core = { path = "crates/omini-core" }
omini-config = { path = "crates/omini-config" }
omini-domain = { path = "crates/omini-domain" }
omini-model = { path = "crates/omini-model" }
omini-mcp-client = { path = "crates/omini-mcp-client" }
omini-permissions = { path = "crates/omini-permissions" }
omini-provider-api = { path = "crates/omini-provider-api" }
omini-protocol = { path = "crates/omini-protocol" }
omini-runtime-contract = { path = "crates/omini-runtime-contract" }
omini-server = { path = "crates/omini-server" }
omini-entity = { path = "crates/omini-entity" }
omini-tui = { path = "crates/omini-tui" }
