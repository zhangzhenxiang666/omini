[workspace]
members = [
    "crates/omini-cli",
    "crates/omini-runtime",
    "crates/omini-tui",
    "crates/omini-types",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
http = "1.4.0"
pin-project-lite = "0.2.17"
pulldown-cmark = "0.13"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
rmcp = { version = "0.15.0", default-features = false, features = [
    "client",
    "macros",
    "schemars",
    "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
rmcp-reqwest = { package = "reqwest", version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["rt", "rt-multi-thread", "macros", "process", "time"] }
tokio-stream = { version = "0.1.18", features = ["time"] }
toml = "1.1.2"
tracing = "0.1.44"
unicode-width = "0.2"
uuid = { version = "1.23.1", features = ["v4"] }

omini-runtime = { path = "crates/omini-runtime" }
omini-tui = { path = "crates/omini-tui" }
omini-types = { path = "crates/omini-types" }
