[package]
name = "omini"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
http = "1.4.0"
pin-project-lite = "0.2.17"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["rt", "rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1.18", features = ["time"] }
toml = "1.1.2"
tracing = "0.1.44"
unicode-width = "0.2"
uuid = { version = "1.23.1", features = ["v4"] }
